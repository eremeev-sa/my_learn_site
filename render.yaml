services:
  - type: web
    name: dev-growth
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: dev-growth-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_USERNAME
        value: Eremeev-SA
      - key: OWNER_PASSWORD
        sync: false
